const tipSeen=new Set();let tipLast=0;
function showTip(now){ // una nota cada ~11 s; si acaba de pasar lo que explica una, esa sale primero
  if(now-S.t0<4000||now-tipLast<5000||now-S.lastSay<3000)return;
  let c=TIPS.filter(x=>!tipSeen.has(x.id)&&x.ok());
  if(!c.length){tipSeen.clear();c=TIPS.filter(x=>x.ok())}
  if(!c.length)return;
  const hot=c.some(x=>x.now&&x.now());                                              // algo que explica una nota acaba de pasar: puede salir antes
  if(!hot&&now-tipLast<11000)return;
  const rank=x=>(x.now&&x.now()?(x.ev?20:10):0)+(PIECE.on&&x.live?1:0);          // 1.º lo que acaba de pasar, 2.º cambios de estado, 3.º lo que se ve mientras suena
  c.sort((a,b)=>rank(b)-rank(a));
  const x=c[0];tipSeen.add(x.id);tipLast=now;
  const el=$('tip');
  el.innerHTML='<small>cómo funciona</small>'+x.t;
  el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
}

/* ---------- arranque ---------- */
async function start(){
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});
  ac=new (window.AudioContext||window.webkitAudioContext)();
  await ac.resume();
  const src=ac.createMediaStreamSource(stream);
  an=ac.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=.2;
  src.connect(an); // el micrófono solo entra al análisis: no se graba ni se reproduce
  tbuf=new Float32Array(an.fftSize);fbuf=new Float32Array(an.frequencyBinCount);
  bw=ac.sampleRate/an.fftSize;

  noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
  const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;

  const master=ac.createGain(),dry=ac.createGain(),verb=ac.createConvolver();
  master.gain.value=.8;verb.buffer=impulse(1.1);
  comp=ac.createDynamicsCompressor();
  comp.threshold.value=-18;comp.ratio.value=4;comp.attack.value=.005;comp.release.value=.2;
  inst=ac.createGain();bright=ac.createBiquadFilter();bright.type='lowpass';bright.frequency.value=4800;
  wet=ac.createGain();wet.gain.value=.12;
  pg=ac.createGain();inst.connect(pg);pg.connect(bright);   // pg: volumen de la pieza (baja y sube sin tocar la base)
  bright.connect(dry);bright.connect(verb);verb.connect(wet);
  const lim=ac.createDynamicsCompressor();             // limitador: evita saturaciones aunque suenen muchas capas
  lim.threshold.value=-4;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.002;lim.release.value=.12;
  dry.connect(master);wet.connect(master);master.connect(comp);comp.connect(lim);lim.connect(ac.destination);

  // cepillo suave (para roces)
  const hs=ac.createBufferSource();hs.buffer=noiseBuf;hs.loop=true;
  const hf=ac.createBiquadFilter();hf.type='bandpass';hf.frequency.value=5200;hf.Q.value=.6;
  hissG=ac.createGain();hissG.gain.value=0;
  hs.connect(hf);hf.connect(hissG);hissG.connect(inst);hs.start();

  // se graba solo la música que genera la pieza, nunca el micrófono
  recDest=ac.createMediaStreamDestination();lim.connect(recDest);recStart();   // solo se graba la música que genera la pieza
  wafScript(); // instrumentos de orquesta (si no hay internet, suena el respaldo sintético)
  droneTo(9,6); // la base sostenida empieza a sonar desde el primer momento

  S.t0=performance.now();S.running=true;
  document.body.classList.add('on');
  applyEnv();
  setInterval(musicTick,100);
  setInterval(updateKey,1000);
  setInterval(()=>applyEnv(),5000);
  setInterval(()=>{if(!S.paused)decide()},4000);
  say('Estoy escuchando. La música va a salir de lo que suene aquí.');
  if(PLACE){loadWeather();setInterval(loadWeather,15*60*1000)}   // el clima es opcional
  // si la pestaña queda en segundo plano el navegador pausa la pantalla: el análisis del micrófono sigue por este temporizador
  setInterval(()=>{if(S.running&&!S.paused&&document.hidden===true)analyse(performance.now())},60);
  wake();
}

/* ---------- visual ---------- */
const cv=$('c'),g=cv.getContext('2d');
let dpr=1;
function rs(){dpr=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr}
addEventListener('resize',rs);rs();

const STOPS=[[0,[34,31,44]],[5,[44,40,58]],[6.5,[246,226,220]],[9,[247,242,234]],[15,[246,238,228]],[17.5,[246,214,200]],[19,[74,58,84]],[21,[34,31,44]],[24,[34,31,44]]];
function themeBg(){
  const h=hourNow();let c=STOPS[0][1];
  for(let i=0;i<STOPS.length-1;i++){
    const[a,ca]=STOPS[i],[b,cb]=STOPS[i+1];
    if(h>=a&&h<=b){const t=(h-a)/(b-a);c=ca.map((v,k)=>v+(cb[k]-v)*t);break}
  }
  const grey=[150,160,176],mix=S.weather.cloud/100*.1+(S.rain?.18:0);
  return c.map((v,k)=>Math.round(v+(grey[k]-v)*mix));
}
function setTheme(){
  const bg=themeBg();S.bg=bg;
  const lum=(.299*bg[0]+.587*bg[1]+.114*bg[2])/255,dark=lum<.5;
  const ink=dark?[239,234,245]:[43,39,48],st=document.documentElement.style;
  S.ink=ink;
  st.setProperty('--bg',`rgb(${bg})`);
  st.setProperty('--ink',`rgb(${ink})`);
  st.setProperty('--soft',`rgba(${ink},.5)`);
  st.setProperty('--line',`rgba(${ink},.16)`);
}

let last=0,tick=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;const t=ts/1000;
  if(S.running&&!S.paused)analyse(ts);
  if(S.running){S.onsets=S.onsets.filter(o=>ts-o<10000);S.rate=S.onsets.length*6}
  S.lowSm+=(S.lowN-S.lowSm)*.08;S.midSm+=(S.midN-S.midSm)*.08;S.highSm+=(S.highN-S.highSm)*.08;
  SEQ.pulse*=.9;
  if(S.running&&!S.paused){
    hissG.gain.setTargetAtTime(S.hiss?clamp(S.highSm*.05,0,.05):0,ac.currentTime,.12);
    if(S.voiced)trace.push({t:ts,y:yOfF(S.pf),k:S.pf>T.whistleHz,a:clamp(.4+S.rmsN,0,1)});
  }
  if(tick%20===0)setTheme();
  if(tick%30===0){for(let i=notes.length-1;i>=0;i--)if(ts-notes[i].t>7200)notes.splice(i,1)}
  if(tick%3===0)$('lvb').style.width=Math.round(clamp(Math.sqrt(S.rms/.06),0,1)*100)+'%';
  tick++;
  draw(dt,t,ts);
  requestAnimationFrame(frame);
}
function draw(dt,t,ts){
  const w=innerWidth,h=innerHeight,ink=S.ink;
  g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle=`rgb(${S.bg})`;g.fillRect(0,0,w,h);

  // pad: resplandor que sube desde abajo con el zumbido y late con el bombo
  const pl=Math.min(1,S.lowSm*(1+.25*SEQ.pulse));
  [[.5+.18*Math.sin(t*.12),1.08,.8,.5],[.3+.2*Math.cos(t*.09),1.15,.6,.28]].forEach(([fx,fy,fr,fa])=>{
    const cx=w*fx,cy=h*fy,r=Math.max(w,h)*fr*(.5+.5*pl);
    const gr=g.createRadialGradient(cx,cy,0,cx,cy,r);
    gr.addColorStop(0,rgba(COL.pad,(.1+.4*pl)*fa*2));
    gr.addColorStop(1,rgba(COL.pad,0));
    g.fillStyle=gr;g.fillRect(0,0,w,h);
  });

  // golpe grave: disco grande y suave
  for(let i=discs.length-1;i>=0;i--){
    const d=discs[i];d.r+=d.v*dt;d.a-=dt*.7;
    if(d.a<=0){discs.splice(i,1);continue}
    const gr=g.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r);
    gr.addColorStop(0,rgba(COL.mar,d.a*.32));
    gr.addColorStop(.7,rgba(COL.pad,d.a*.18));
    gr.addColorStop(1,rgba(COL.pad,0));
    g.fillStyle=gr;g.beginPath();g.arc(d.x,d.y,d.r,0,6.283);g.fill();
  }

  // el espacio respira: línea fina que sigue el volumen
  const amp=4+60*S.rmsN;
  for(let k=0;k<2;k++){
    g.beginPath();
    for(let x=0;x<=w;x+=6){
      const e=Math.sin(Math.PI*x/w);
      const y=h*.5+k*9+e*amp*(Math.sin(x*.005+t*(.9+k*.25)+k)*.6+Math.sin(x*.013-t*1.4)*.4);
      x?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.strokeStyle=rgba(COL.str,k?.14:.4);g.lineWidth=k?1:1.2;g.lineCap='round';g.stroke();
  }

  // la banda: cada nota recorre la pantalla de derecha a izquierda
  const SPEED=130,HEAD=w*.88,LIFE=7000;
  g.lineCap='round';g.lineJoin='round';
  for(const n of notes){
    if(ts<n.t)continue;
    const age=(ts-n.t)/LIFE;if(age>1)continue;
    const x=HEAD-(ts-n.t)/1000*SPEED,al=(1-age)*(.55+.45*n.v),cc=n.r?ROLE_COL[n.r]:null;   // cc: el papel (armonía, bajo, pulso, melodía, color) tiñe la nota
    switch(n.k){
      case 'bass':{const wd=Math.max(14,n.len*SPEED*.9);g.fillStyle=rgba(cc||COL.bass,al*.8);
        g.beginPath();g.roundRect?g.roundRect(x,n.y-5,wd,10,5):g.rect(x,n.y-5,wd,10);g.fill();break}
      case 'str':{const wd=n.len*SPEED;g.fillStyle=rgba(cc||COL.strl,al*.55);
        g.beginPath();g.roundRect?g.roundRect(x,n.y-4,wd,8,4):g.rect(x,n.y-4,wd,8);g.fill();break}
      case 'arp':g.fillStyle=rgba(cc||COL.str,al);g.beginPath();g.arc(x,n.y,3.2,0,6.283);g.fill();break;
      case 'vib':g.strokeStyle=rgba(cc||COL.mar,al);g.lineWidth=1.3;g.beginPath();g.arc(x,n.y,6,0,6.283);g.stroke();
        g.fillStyle=rgba(cc||COL.mar,al);g.beginPath();g.arc(x,n.y,2,0,6.283);g.fill();break;
      case 'bell':g.fillStyle=rgba(COL.bel,al*.18);g.beginPath();g.arc(x,n.y,9,0,6.283);g.fill();
        g.fillStyle=rgba(COL.bel,al);g.beginPath();g.arc(x,n.y,2.8,0,6.283);g.fill();break;
      case 'kick':g.fillStyle=rgba(COL.bass,al*.5);g.beginPath();g.arc(x,h*.83,9*(.6+.4*n.v),0,6.283);g.fill();break;
      case 'snare':g.strokeStyle=rgba(COL.mar,al);g.lineWidth=1.3;g.beginPath();g.arc(x,h*.83,6,0,6.283);g.stroke();break;
      case 'hat':g.strokeStyle=rgba(ink,al*.4);g.lineWidth=1.2;g.beginPath();g.moveTo(x,h*.83-7);g.lineTo(x,h*.83+7);g.stroke();break;
      case 'shk':g.fillStyle=rgba(ink,al*.35);g.beginPath();g.arc(x,h*.83,1.4,0,6.283);g.fill();break;
    }
  }

  // voz y silbido: cinta con la altura de la nota
  while(trace.length&&ts-trace[0].t>LIFE)trace.shift();
  while(beads.length&&ts-beads[0].t>LIFE)beads.shift();
  for(let i=1;i<trace.length;i++){
    const a=trace[i-1],b=trace[i];
    if(b.t-a.t>120)continue;
    const al=(1-(ts-b.t)/LIFE)*b.a;
    g.beginPath();g.moveTo(HEAD-(ts-a.t)/1000*SPEED,a.y);g.lineTo(HEAD-(ts-b.t)/1000*SPEED,b.y);
    g.strokeStyle=rgba(b.k?COL.bel:COL.str,al);g.lineWidth=2.6;g.stroke();
  }
  beads.forEach(b=>{
    const x=HEAD-(ts-b.t)/1000*SPEED,al=1-(ts-b.t)/LIFE,c=b.k?COL.bel:COL.str;
    g.fillStyle=rgba(c,al*.18);g.beginPath();g.arc(x,b.y,9,0,6.283);g.fill();
    g.fillStyle=rgba(c,al);g.beginPath();g.arc(x,b.y,3.2,0,6.283);g.fill();
  });
  if(trace.length&&ts-trace[trace.length-1].t<150){
    const p=trace[trace.length-1],c=p.k?COL.bel:COL.str;
    g.fillStyle=rgba(c,.25);g.beginPath();g.arc(HEAD,p.y,12,0,6.283);g.fill();
    g.fillStyle=rgba(c,1);g.beginPath();g.arc(HEAD,p.y,4,0,6.283);g.fill();
  }

  // toque: anillos finos
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.r+=r.v*dt;r.a-=dt*.32;
    if(r.a<=0){rings.splice(i,1);continue}
    g.beginPath();g.arc(r.x,r.y,r.r,0,6.283);
    g.strokeStyle=rgba(COL.mar,r.a*r.a*.85);g.lineWidth=1;g.stroke();
  }

  // aplauso: chispas
  const fr=Math.pow(.03,dt);
  for(let i=bursts.length-1;i>=0;i--){
    const p=bursts[i];p.vx*=fr;p.vy*=fr;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=dt*.85;
    if(p.a<=0){bursts.splice(i,1);continue}
    g.strokeStyle=rgba(p.c,p.a);g.lineWidth=p.s*.6;
    g.beginPath();g.moveTo(p.x-p.vx*.035,p.y-p.vy*.035);g.lineTo(p.x,p.y);g.stroke();
    g.fillStyle=rgba(p.c,p.a);g.beginPath();g.arc(p.x,p.y,p.s,0,6.283);g.fill();
  }

  // roce: polvo que flota
  if(S.hiss){
    const n=Math.round(dt*220*(.4+S.highSm));
    for(let i=0;i<n;i++)dust.push({x:rnd(0,w),y:rnd(h*.25,h*.9),vx:rnd(-8,8),vy:rnd(-34,-10),a:rnd(.7,1),s:rnd(1.2,2.6),c:Math.random()<.5?COL.str:COL.bel});
  }
  for(let i=dust.length-1;i>=0;i--){
    const p=dust[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=dt*.5;
    if(p.a<=0){dust.splice(i,1);continue}
    g.fillStyle=rgba(p.c,Math.min(1,p.a*1.1));g.beginPath();g.arc(p.x,p.y,p.s,0,6.283);g.fill();
  }
  drawMind(w,h,ts,dt,ink);
}

/* ---------- la pieza se ve construirse: capas, forma, memoria del lugar, ritmo y motivo ---------- */
const ROLE_COL={arm:[178,160,214],bajo:[142,120,196],pulso:[236,120,158],mel:[226,176,52],color:[242,160,122]};
const ROLE_ES={arm:'armonía',bajo:'bajo',pulso:'pulso',mel:'melodía',color:'color'};
const SEC_ES={intro:'introducción',desarrollo:'desarrollo',contraste:'contraste',climax:'clímax',reposo:'reposo'};
const OP_ES={declaracion:'declaración',eco:'eco',secuencia:'secuencia',inversion:'inversión',fragmento:'fragmento',disminucion:'disminución',aumentacion:'aumentación',ascenso:'ascenso',descenso:'descenso',cadencia:'cadencia'};
const lay={arm:0,bajo:0,pulso:0,mel:0,color:0};
const txtAt=(txt,x,y,a,ink,align)=>{g.fillStyle=rgba(ink,a);g.textAlign=align||'left';g.fillText(txt,x,y)};
function drawMind(w,h,ts,dt,ink){
  if(!S.running)return;
  g.save();
  g.font='10px Inter,system-ui,sans-serif';g.textBaseline='middle';g.lineWidth=1;
  const on=PIECE.on;
  for(const r in lay)lay[r]+=(((on&&FORM.prev.includes(r))?1:0)-lay[r])*Math.min(1,dt*2);
  // capas: entran y salen según la actividad del lugar
  ['arm','bajo','pulso','mel','color'].forEach((r,i)=>{
    const a=lay[r];if(a<.03)return;
    const y=h*.4+i*22,col=ROLE_COL[r];
    g.fillStyle=rgba(col,.9*a);g.beginPath();g.arc(34,y,4.5,0,6.283);g.fill();
    g.strokeStyle=rgba(col,.35*a);g.beginPath();g.arc(34,y,8+3*Math.sin(ts/500+i),0,6.283);g.stroke();
    txtAt(ROLE_ES[r]+(ROLE.inst[r]?' · '+NOMBRE[ROLE.inst[r]]:''),50,y,.7*a,ink);
  });
  // forma: sección, los 4 compases de la frase, tensión y energía
  if(on){
    const x0=30,y0=66;
    txtAt('FRASE '+Math.max(1,FORM.phrase),x0,y0,.55,ink);
    for(let i=0;i<4;i++){
      g.beginPath();g.arc(x0+4+i*14,y0+16,3,0,6.283);
      if(i===FORM.pb){g.fillStyle=rgba(ink,.8);g.fill()}else{g.strokeStyle=rgba(ink,.35);g.stroke()}
    }
    const bar=(y,v,col,txt)=>{
      g.strokeStyle=rgba(ink,.12);g.lineWidth=2;g.beginPath();g.moveTo(x0,y);g.lineTo(x0+100,y);g.stroke();
      g.strokeStyle=rgba(col,.85);g.beginPath();g.moveTo(x0,y);g.lineTo(x0+100*clamp(v,0,1),y);g.stroke();
      g.lineWidth=1;txtAt(txt,x0+110,y,.4,ink);
    };
    bar(y0+32,INT.tension,[236,120,158],'tensión');
    bar(y0+44,SP.e1,[178,160,214],'energía');
  }
  if(w>=720){
    // memoria del lugar: cada círculo es un tipo de sonido (posición = brillo y ancho; tamaño = importancia)
    const x0=w*.28,x1=w*.72,yb=46;
    txtAt('MEMORIA DEL LUGAR',(x0+x1)/2,22,.3,ink,'center');
    const pos=ty=>({x:lerp(x0,x1,clamp((ty.f-6.8)/6.2,0,1)),y:yb+clamp(ty.b,0,.6)*45});
    for(const k in CHAIN){                                                       // relaciones: qué sonido suele seguir a cuál
      const c=CHAIN[k];if(c.n<2)continue;
      const A=SND.find(q=>q.id===c.a),B=SND.find(q=>q.id===c.b);if(!A||!B)continue;
      const pa=pos(A),pb=pos(B);
      g.strokeStyle=rgba(ink,Math.min(.3,.06*c.n));g.beginPath();g.moveTo(pa.x,pa.y);g.lineTo(pb.x,pb.y);g.stroke();
    }
    for(const ty of SND){
      const p=pos(ty),imp=typeImp(ty,ts),r=2.5+8*imp,rec=ty.n>=3&&ty.reg>=.5;
      ty.flash*=Math.pow(.15,dt);
      g.fillStyle=rgba(rec?[236,120,158]:ink,rec?.55:.28);g.beginPath();g.arc(p.x,p.y,r,0,6.283);g.fill();
      if(ty.per){                                                                // anillo punteado: se repite con regularidad
        if(g.setLineDash)g.setLineDash([2,3]);
        g.strokeStyle=rgba([236,120,158],.5);g.beginPath();g.arc(p.x,p.y,r+4,0,6.283);g.stroke();
        if(g.setLineDash)g.setLineDash([]);
      }
      if(ty.flash>.03){g.strokeStyle=rgba(rec?[236,120,158]:ink,ty.flash*.7);g.beginPath();g.arc(p.x,p.y,r+(1-ty.flash)*18,0,6.283);g.stroke()}   // acaba de sonar
    }
    // ritmo recurrente (los 16 pasos del compás) con el cursor de lo que suena ahora
    const gx=w-250,gy=36,cw=13;
    txtAt('RITMO DEL LUGAR',gx,22,.3,ink);
    const cur=on?(((Math.floor((ac.currentTime-PIECE.t0)/PIECE.step))%16)+16)%16:-1;
    for(let s2=0;s2<16;s2++){
      let str=0;for(const ty of SND){const p=ty.pat[s2];if(p)str=Math.max(str,Math.min(1,p.conf/4)*Math.min(1,p.vel+.25))}
      g.fillStyle=str>0?rgba([236,120,158],.15+.7*str):rgba(ink,.08);g.fillRect(gx+s2*cw,gy,cw-2,10);
      if(s2===cur){g.strokeStyle=rgba(ink,.7);g.strokeRect(gx+s2*cw-1,gy-2,cw,14)}
    }
    // motivo que se está desarrollando (notas y ritmo) y cómo se transforma
    const mm=FORM.melMot,age=mm?(ts-FORM.melT)/7000:1;
    if(mm&&age<1){
      const dm=Math.min(...mm.degs),dM=Math.max(...mm.degs),span=Math.max(16,mm.steps[mm.steps.length-1]+1),mx=200/span;
      const my=d=>gy+58-((d-dm)/Math.max(1,dM-dm))*34;
      g.strokeStyle=rgba(ROLE_COL.mel,.35*(1-age));g.beginPath();
      mm.steps.forEach((s2,i)=>{const px=gx+s2*mx+3,py=my(mm.degs[i]);if(i)g.lineTo(px,py);else g.moveTo(px,py)});g.stroke();
      mm.steps.forEach((s2,i)=>{g.fillStyle=rgba(ROLE_COL.mel,.9*(1-age));g.beginPath();g.arc(gx+s2*mx+3,my(mm.degs[i]),3,0,6.283);g.fill()});
      txtAt((OP_ES[mm.op]||mm.op)+' · motivo de '+mm.src+(mm.gen?' (variación '+mm.gen+')':''),gx,gy+72,.55*(1-age),ink);
    }
  }
  g.restore();
}

$('img').onclick=()=>{

  const x=c.getContext('2d');
  x.fillStyle=`rgb(${S.bg})`;x.fillRect(0,0,c.width,c.height);
  x.drawImage(cv,0,0);
  const lum=(.299*S.bg[0]+.587*S.bg[1]+.114*S.bg[2])/255;
  x.fillStyle=lum<.5?'#efeaf5':'#2b2730';
  x.font=`${15*dpr}px Inter, system-ui, sans-serif`;
  x.fillText(`${new Date().toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'})} · ${clockStr()} · escala ${mode.n} · ${Math.round(SEQ.bpm)} bpm`,24*dpr,cv.height+38*dpr);
  c.toBlob(b=>download(b,'retrato-'+stamp()+'.png'));
};
$('log').onclick=()=>{
  const dur=(performance.now()-S.t0)/1000;
  const L=[
    'TRADUCTOR DE ESPACIOS — REGISTRO',
    'Lugar: (escríbelo aquí)',
    'Fecha: '+new Date().toLocaleString('es-CO'),
    'Duración: '+fmt(dur),
    'Clima: '+(S.weather.real?S.weather.label:'no se usa'),
    'Escala final: '+mode.n,
    'Tempo final: '+Math.round(SEQ.bpm)+' bpm',
    'Frases que la orquesta respondió: '+S.stats.ans,
    'Toques secos (pizzicato): '+S.stats.tap,
    'Aplausos y golpes agudos (caja y cuerdas): '+S.stats.clap,
    'Golpes graves (timbales y contrabajo): '+S.stats.thud,
    'Notas seguidas de voz o silbido: '+S.stats.voice,
    'Cambios de acorde: '+S.stats.chords,
    'Silencio promedio: '+Math.round(S.silTotal/Math.max(1,S.frames)*100)+'%',
    '',
    'DECISIONES DEL AGENTE',
    ...S.log.map(l=>`[${fmt(l.t)}] ${l.text}`),
    '',
    'No se guardó audio del lugar. Solo se midieron volumen y frecuencias.'
  ];
  download(new Blob([L.join('\n')],{type:'text/plain'}),'registro-'+stamp()+'.txt');
};

let rec,recChunks=[],recDest;
function recStart(){
  rec=new MediaRecorder(recDest.stream);recChunks=[];
  rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
  rec.start(1000);
}
function recGate(on){ // solo se graba mientras hay música: la canción no trae silencios
  if(!rec)return;
  try{if(on&&rec.state==='paused')rec.resume();else if(!on&&rec.state==='recording')rec.pause()}catch(e){}
}
function wav(buf){
  const ch=buf.numberOfChannels,len=buf.length,sr=buf.sampleRate,n=len*ch*2,v=new DataView(new ArrayBuffer(44+n));
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');v.setUint32(4,36+n,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);
  v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);
  v.setUint16(32,ch*2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n,true);
  const d=[];for(let c=0;c<ch;c++)d.push(buf.getChannelData(c));
  let o=44;
  for(let i=0;i<len;i++)for(let c=0;c<ch;c++){const s=clamp(d[c][i],-1,1);v.setInt16(o,s<0?s*32768:s*32767,true);o+=2}
  return new Blob([v],{type:'audio/wav'});
}
$('mus').onclick=()=>{
  if(!rec||rec.state==='inactive')return;
  const r=rec;
  r.onstop=async()=>{
    const blob=new Blob(recChunks,{type:r.mimeType});
    recStart();
    try{
      const buf=await ac.decodeAudioData(await blob.arrayBuffer());
      download(wav(buf),'musica-'+stamp()+'.wav');
    }catch(e){download(blob,'musica-'+stamp()+'.webm')}
  };
  r.stop();
};
$('pause').onclick=()=>{
  S.paused=!S.paused;
  $('pause').textContent=S.paused?'seguir':'pausa';
  S.paused?ac.suspend():ac.resume();
};
$('sens').oninput=e=>{S.sens=+e.target.value};

$('go').onclick=()=>start().catch(e=>{
  $('err').textContent='No pude usar el micrófono. Revisa el permiso en el candado junto a la dirección y vuelve a intentar.';
});
setTheme();
requestAnimationFrame(frame);
</script>
